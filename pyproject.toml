[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pss-export"
version = "0.1.0"
description = "Export models from the Plant Stress Signalling (PSS) Neo4j knowledge graph to various file formats."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Carissa Bleker", email = "carissa.bleker@nib.si"}
]
maintainers = [
    {name = "Carissa Bleker", email = "carissa.bleker@nib.si"}
]
keywords = [
    "systems biology",
    "knowledge graph",
    "SBML",
    "Neo4j",
    "plant stress signalling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Database",
]

# Core dependencies
dependencies = [
    "neo4j>=4.4,<5.0",
    "python-libsbml>=5.19.0",
    "tabularqual>=0.1.0",
    "pyyaml>=5.4",
    "click>=8.0",
    "python-dotenv>=0.19.0",
    "pandas>=1.3.0",
    "networkx>=2.6",
    "rich>=10.0",
    "matplotlib>=3.4",
]

[project.urls]
Homepage = "https://github.com/NIB-SI/pss-export"

[project.scripts]
pss-export = "pss_export.cli:cli"

[tool.setuptools]
packages = ["pss_export"]

[tool.setuptools.package-data]
pss_export = ["*.yaml", "*.yml"]

# Black code formatter configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

# Ruff linter configuration
[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--cov=pss_export",
    "--cov-report=term-missing",
    "--cov-report=html",
]

# MyPy type checker configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
